<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Athenaeum</title>
  <meta name="description" content="Athenaeum, a pillar of Prometheus: every idea as a star, with everything it became, and a chronicle of causes and consequences.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#04050c">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../../kit/prometheus.css">
  <link rel="stylesheet" href="app.css">
  <link rel="modulepreload" href="js/app.js"><link rel="modulepreload" href="js/sky.js"><link rel="modulepreload" href="js/model.js">
</head>
<body data-pillar="athenaeum" class="ath">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div id="ath-layer"></div>
  <div class="shell">
    <header class="bar">
      <a class="ath-home" href="../../" aria-label="Back to the core"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M5 8h14L12 4zM7 8v9M12 8v9M17 8v9M5 17h14"/></svg></a>
      <span class="ath-title"><span class="name">Athenaeum</span><span class="ath-count" id="ath-count"></span></span>
      <span class="spacer"></span>
      <button class="ath-ic" id="ath-find" type="button" aria-label="Search everything here"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
      <button class="ath-ic" id="ath-more" type="button" aria-label="Backup, sound and more"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
    </header>
    <main id="app"></main>
  </div>
  <noscript><p style="padding:90px 20px;color:#e8eef7">Athenaeum needs JavaScript to open.</p></noscript>
  <script src="../../kit/kit.js"></script>
  <script src="../../kit/bus.js"></script>
  <script src="vault.js"></script>
  <script src="history-seed.js"></script>
  <script src="ideas-seed.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
