name: proofs-live
# Runs the deck's proofs in a real browser against the live site after every Pages deployment (and on demand).
# The result, failed lines included, is written into STATUS.md. The commit happens only when the pass/fail
# set changes, so a green run does not redeploy the site and start this workflow again.
on:
  workflow_dispatch:
  deployment_status:
permissions:
  contents: write
jobs:
  proofs:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Unit proofs
        run: node --test proofs/unit/*.test.mjs
      - name: Proofs against the live site
        id: live
        continue-on-error: true
        run: |
          sleep 20
          python3 proofs/run.py https://jpavia10.github.io/prometheus-hub/ --out proofs-live.json
      - name: Write the live result into STATUS.md
        if: always()
        env:
          PROOFS_LIVE_NOTE: "Quoted from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
        run: |
          if [ ! -f proofs-live.json ]; then echo "no proof report to record"; exit 0; fi
          python3 proofs/write_status.py proofs-live.json STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          if git diff --cached --quiet; then
            echo "STATUS.md already quotes this outcome"
          else
            git commit -m "status: quote proofs-live run ${{ github.run_id }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Live build matches the repository
        if: steps.live.outcome == 'success'
        run: |
          python3 - <<'PY'
          import re, urllib.request
          want = re.search(r'BUILD = "([^"]+)"', open("deck/app.js").read()).group(1)
          got = re.search(r'BUILD = "([^"]+)"', urllib.request.urlopen("https://jpavia10.github.io/prometheus-hub/deck/app.js").read().decode()).group(1)
          print("repository", want, "live", got); assert want == got
          PY
      - name: Proofs must pass
        if: steps.live.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofs-live
          path: proofs-live.json
