name: lighthouse
# Separate from checks.yml. Serves this checkout and runs @lhci/cli on the hub
# and three local pillars, mobile emulation. Performance is a warning.
# Accessibility, best-practices, and the installable checks fail the job.
on:
  pull_request:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node is new enough for Lighthouse 13
        run: node -e 'const [maj, min] = process.versions.node.split(".").map(Number); if (maj < 22 || (maj === 22 && min < 19)) { console.error("Lighthouse 13 needs Node >= 22.19, got " + process.version); process.exit(1); }'
      - name: Chrome
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update -qq
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --version
      - name: Lighthouse CI
        env:
          CI: "true"
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          npm install --prefix "${RUNNER_TEMP}/lhci" --no-fund --no-audit @lhci/cli@0.16.1
          "${RUNNER_TEMP}/lhci/node_modules/.bin/lhci" autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: warn
